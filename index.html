<!DOCTYPE html>
<html>
<head>
    <title>Hüseyin Afşin</title>
    <!-- Styles -->
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/customize.css">
    <link rel="stylesheet" href="https://unpkg.com/github-calendar@latest/dist/github-calendar-responsive.css"
/>

</head>

<body>
  <div class="h-container">
    <div class="row">
      <div class="col-md-8">
        <div class="row">
          <div class="col-md-5">
            <div class="card card-profile">
              <img src="./img/profile.jpeg" alt="" srcset="">
            </div>
          </div>
          <div class="col-md-7">
            <div class="row">
              <div class="card card-about">
                <h2><Title></Title></h2>
                <img src="" alt="" srcset=""> 
              </div>            </div>
            <div class="row">
              <div class="card">
                <div class="card card-music">
                  <iframe id="spotify-frame" style="border-radius:12px;" src="https://open.spotify.com/embed/album/3cyyJALrHc8LawnQNFYRWL?utm_source=generator" width="500px" height="123px" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>           
                </div>               
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="card card-work">
              <div class="calendar">
          </div>
          </div>          
        </div>
      </div>
      <div class="col-md-4">
        <div class="row">
          <div class="card card-temp">
            <div id="carouselId" class="carousel slide" data-ride="carousel">
              <ol class="carousel-indicators">
                <li data-target="#carouselId" data-slide-to="0" class="active"></li>
                <li data-target="#carouselId" data-slide-to="1"></li>
                <li data-target="#carouselId" data-slide-to="2"></li>
              </ol>
              <div class="carousel-inner" role="listbox">
                <div class="carousel-item active">
                  <img src="./img/profile.jpeg" alt="First slide" width="500px" height="400px" >
                </div>
                <div class="carousel-item">
                  <img src="./img/profile.jpeg" alt="First slide" width="500px" height="400px" >
                </div>
                <div class="carousel-item">
                  <img src="./img/profile.jpeg" alt="First slide" width="500px" height="400px" >
                </div>
              </div>
              <a class="carousel-control-prev" href="#carouselId" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
              </a>
              <a class="carousel-control-next" href="#carouselId" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
              </a>
            </div>
          </div>        
        </div>
        <div class="row">
          <div class="card card-tech">
            <button type="button">
              <span>
                <i class="fas fa-arrow-up "></i>
              </span>
            </button>
            <div class="logo-box"></div>
            <div class="logo-box"></div>
            <div class="logo-box"></div>
            <button type="button">
              <span>
                <i class="fa fa-arrow-circle-down" aria-hidden="true"></i>
              </span>
            </button>
          </div>        </div>
        <div class="row">
        <div class="card card-stack"></div>       
        </div>
      </div>
    </div>
  </div>
<script src="./scripts/bootstrap.min.js"></script>
<!-- <script src="scripts/scripts.js"></script> -->

</body>
</html>
